<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабинеты</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

{% include "_nav.html" %}

<div class="mgmt-area">
    <div class="mgmt-toolbar">
        <button class="btn-add" id="addBtn">+ Добавить кабинет</button>
    </div>
    <table class="mgmt-table">
        <thead>
            <tr><th>Номер</th><th>Название</th><th>Тип</th><th>Мест</th><th></th></tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="5" class="loading">Загрузка…</td></tr>
        </tbody>
    </table>
</div>

<div id="itemModal" class="modal hidden">
    <div class="modal-content">
        <h3 id="modalTitle">Добавление кабинета</h3>
        <form id="itemForm">
            <input type="hidden" id="itemId">
            <label>Номер кабинета
                <input type="text" id="fieldNumber" required placeholder="305">
            </label>
            <label>Название
                <input type="text" id="fieldName" placeholder="Компьютерный класс">
            </label>
            <label>Тип кабинета
                <input type="text" id="fieldType" placeholder="лаборатория">
            </label>
            <label>Количество мест
                <input type="text" inputmode="numeric" id="fieldSeats" placeholder="25">
            </label>
            <div id="errorBox" class="conflict-warning hidden"></div>
            <div class="modal-actions">
                <button type="button" id="deleteBtn" class="btn-danger hidden">Удалить</button>
                <button type="button" id="cancelBtn" class="btn-secondary">Отмена</button>
                <button type="submit" class="btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/classrooms.js"></script>
</body>
</html>
