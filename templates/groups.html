<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Группы</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

{% include "_nav.html" %}

<div class="mgmt-area">
    <div class="mgmt-toolbar">
        <button class="btn-add" id="addBtn">+ Добавить группу</button>
    </div>
    <table class="mgmt-table">
        <thead>
            <tr><th>Название</th><th>Специальность</th><th>Курс</th><th></th></tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="4" class="loading">Загрузка…</td></tr>
        </tbody>
    </table>
</div>

<div id="itemModal" class="modal hidden">
    <div class="modal-content">
        <h3 id="modalTitle">Добавление группы</h3>
        <form id="itemForm">
            <input type="hidden" id="itemId">
            <label>Название группы
                <input type="text" id="fieldName" required placeholder="П-21">
            </label>
            <label>Специальность
                <input type="text" id="fieldSpeciality" required placeholder="Программирование">
            </label>
            <label>Курс
                <input type="text" inputmode="numeric" id="fieldCourse" required placeholder="2">
            </label>
            <div id="errorBox" class="conflict-warning hidden"></div>
            <div class="modal-actions">
                <button type="button" id="deleteBtn" class="btn-danger hidden">Удалить</button>
                <button type="button" id="cancelBtn" class="btn-secondary">Отмена</button>
                <button type="submit" class="btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/groups.js"></script>
</body>
</html>
