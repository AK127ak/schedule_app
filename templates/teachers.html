{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}

{% include "_nav.html" %}

<div class="mgmt-area">
    <div class="mgmt-toolbar">
        <button class="btn-add" id="addBtn">+ Добавить преподавателя</button>
    </div>
    <table class="mgmt-table">
        <thead>
            <tr><th>Цвет</th><th>Краткое</th><th>ФИО</th><th>Дисциплины</th><th></th></tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="5" class="loading">Загрузка…</td></tr>
        </tbody>
    </table>
</div>

<div id="itemModal" class="modal hidden">
    <div class="modal-content">
        <h3 id="modalTitle">Добавление преподавателя</h3>
        <form id="itemForm">
            <input type="hidden" id="itemId">
            <label>ФИО
                <input type="text" id="fieldName" required placeholder="Иванов Сергей Владимирович">
            </label>
            <label>Краткое обозначение
                <input type="text" id="fieldShortName" required placeholder="ИВ">
            </label>
            <label>Цвет карточки
                <input type="color" id="fieldColor" value="#3B82F6">
            </label>
            <label>Дисциплины
                <div id="subjectCheckboxes" class="checkbox-list"></div>
            </label>
            <div id="errorBox" class="conflict-warning hidden"></div>
            <div class="modal-actions">
                <button type="button" id="deleteBtn" class="btn-danger hidden">Удалить</button>
                <button type="button" id="cancelBtn" class="btn-secondary">Отмена</button>
                <button type="submit" class="btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
{% block scripts %}
<script src="/static/js/api.js"></script>
<script src="/static/js/teachers.js"></script>
{% endblock %}
