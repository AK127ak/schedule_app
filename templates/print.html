{% extends "base.html" %}
{% block title %}Печать расписания{% endblock %}
{% block styles %}<link rel="stylesheet" href="/static/css/print.css">{% endblock %}
{% block content %}

<div class="print-toolbar no-print">
    <button onclick="window.print()">🖨 Печать</button>
    <a href="/">← Назад к расписанию</a>
</div>

<div id="printHeader" class="print-header">
    <p class="loading">Загрузка…</p>
</div>

<div id="printTables"></div>

{% endblock %}
{% block scripts %}
<script src="/static/js/api.js"></script>
<script src="/static/js/print.js" data-group-id="{{ group_id }}"></script>
{% endblock %}
