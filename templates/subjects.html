{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}

{% include "_nav.html" %}

<div class="mgmt-area">
    <div class="mgmt-toolbar">
        <button class="btn-add" id="addBtn">+ Добавить дисциплину</button>
    </div>
    <table class="mgmt-table">
        <thead>
            <tr><th>Название</th><th>Сокращение</th><th>Преподаватели</th><th></th></tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="4" class="loading">Загрузка…</td></tr>
        </tbody>
    </table>
</div>

<div id="itemModal" class="modal hidden">
    <div class="modal-content">
        <h3 id="modalTitle">Добавление дисциплины</h3>
        <form id="itemForm">
            <input type="hidden" id="itemId">
            <label>Название
                <input type="text" id="fieldName" required placeholder="Информатика">
            </label>
            <label>Сокращённое название
                <input type="text" id="fieldShortName" required placeholder="ИНФ">
            </label>
            <label>Преподаватели
                <div id="teacherCheckboxes" class="checkbox-list"></div>
            </label>
            <div id="errorBox" class="conflict-warning hidden"></div>
            <div class="modal-actions">
                <button type="button" id="deleteBtn" class="btn-danger hidden">Удалить</button>
                <button type="button" id="cancelBtn" class="btn-secondary">Отмена</button>
                <button type="submit" class="btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
{% block scripts %}
<script src="/static/js/api.js"></script>
<script src="/static/js/subjects.js"></script>
{% endblock %}
